# Chạy: docker compose up -d --build   (cần file .env, đặt DOMAIN và PUBLIC_BASE_URL=https://DOMAIN)
services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    expose:
      - "3000"
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on: [bot]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Đặt DOMAIN trong .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
